name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx --yes @biomejs/biome@2.6.3 ci .

  probe:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/probe.ts
